name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check server executor
      - run: python -m mypy server/personal_agent --ignore-missing-imports
      - run: python -m pytest

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: rana-agent-server:ci
      - name: Build executor amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: rana-agent-executor:ci
      - name: Build watchdog amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/watchdog.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: rana-agent-watchdog:ci
