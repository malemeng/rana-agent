name: personal_agent
description: 独立 Personal Agent Flutter 客户端，支持目标、任务、审批、记忆、日程与实时语音。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  record: ^7.2.0
  flutter_pcm_sound: ^3.3.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
