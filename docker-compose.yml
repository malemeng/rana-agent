name: ${COMPOSE_PROJECT_NAME:-rana-agent}

services:
  server:
    image: ${SERVER_IMAGE:-rana-agent-server}:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    env_file:
      - .env
    environment:
      AGENT_ENVIRONMENT: production
      AGENT_DATA_DIR: /data
      AGENT_ADMIN_PASSWORD: ${AGENT_ADMIN_PASSWORD:?Set AGENT_ADMIN_PASSWORD in .env}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:?Set AGENT_SECRET_KEY in .env}
      AGENT_EXECUTOR_BASE_URL: http://executor:8081
      AGENT_EXECUTOR_TOKEN: ${AGENT_EXECUTOR_TOKEN:?Set AGENT_EXECUTOR_TOKEN in .env}
    ports:
      - "${SERVER_BIND_IP:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    depends_on:
      executor:
        condition: service_healthy
    volumes:
      - agent_data:/data
    networks:
      - frontend
      - backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${SERVER_CPU_LIMIT:-2.0}
          memory: ${SERVER_MEMORY_LIMIT:-2g}
        reservations:
          cpus: 0.25
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  executor:
    image: ${EXECUTOR_IMAGE:-rana-agent-executor}:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: deploy/executor.Dockerfile
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    env_file:
      - .env
    environment:
      AGENT_ENVIRONMENT: production
      EXECUTOR_TOKEN: ${AGENT_EXECUTOR_TOKEN:?Set AGENT_EXECUTOR_TOKEN in .env}
      WORKSPACE_ROOT: /data/workspace
      INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    expose:
      - "8081"
    volumes:
      - executor_data:/data
    networks:
      - frontend
      - backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${EXECUTOR_CPU_LIMIT:-2.0}
          memory: ${EXECUTOR_MEMORY_LIMIT:-2g}
        reservations:
          cpus: 0.25
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchdog:
    image: ${WATCHDOG_IMAGE:-rana-agent-watchdog}:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: deploy/watchdog.Dockerfile
    profiles:
      - watchdog
    environment:
      WATCHDOG_CONTAINER_PREFIX: ${COMPOSE_PROJECT_NAME:-rana-agent}
      WATCHDOG_SERVER_URL: http://server:8080/readyz
      WATCHDOG_EXECUTOR_URL: http://executor:8081/healthz
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-30}
      WATCHDOG_FAILURE_THRESHOLD: ${WATCHDOG_FAILURE_THRESHOLD:-3}
      WATCHDOG_COOLDOWN_SECONDS: ${WATCHDOG_COOLDOWN_SECONDS:-300}
      WATCHDOG_MAX_RESTARTS: ${WATCHDOG_MAX_RESTARTS:-3}
    depends_on:
      server:
        condition: service_healthy
      executor:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  agent_data:
  executor_data:

networks:
  frontend:
  backend:
    internal: true
